docs_dir: source # Где искать исходные .md файлы
site_name: Портфолио лабораторных работ
site_description: Сайт-портфолио студента
site_author: Родина Виктория

theme:
  name: material
  language: ru

  # НАСТРОЙКА ЦВЕТОВ
  palette:
    # Светлая тема (бело-изумрудная)
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Переключить на темную тему

    # Темная тема
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Переключить на светлую тему

  # Дополнительные функции
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

# Навигация
nav:
  - Главная: index.md
  - Об авторе: about.md
  - Лабораторные работы:
    - Лабораторная работа №1: labs/lab1.md
    - Лабораторная работа №2: labs/lab2.md
    - Лабораторная работа №3: labs/lab3.md
    - Лабораторная работа №4: labs/lab4.md
    - Лабораторная работа №5: labs/lab5.md
    - Лабораторная работа №6: labs/lab6.md
    - Лабораторная работа №7: labs/lab7.md
    - Лабораторная работа №8: labs/lab8.md
    - Лабораторная работа №9: labs/lab9.md
    - Лабораторная работа №10: labs/lab10.md

plugins:
  - search